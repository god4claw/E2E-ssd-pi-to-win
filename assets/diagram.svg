<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 840" width="520" height="840" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Схема: где проходит граница шифрования</title>
  <desc id="diagram-desc">Файл идёт из проводника Windows через диск X: в rclone, где шифруется, затем по SFTP и кабелю попадает на Raspberry Pi. Граница шифрования проходит между crypt-слоем и sftp-клиентом: ниже этой линии лежит только шифротекст, который Pi не может прочитать.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .crypto { fill: #eef6ff; stroke: #0969da; stroke-width: 2; }
      .h { font: 700 21px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2328; }
      .lead { font: 400 15px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .card-h { font: 700 18px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2328; }
      .sub { font: 400 14px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .mono { font: 400 16px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #1f2328; }
      .note { font: 400 14.5px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .lbl { font: 600 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #59636e; }
      .flow { stroke: #59636e; stroke-width: 1.8; fill: none; }
      .head { fill: #59636e; }
      .edge { stroke: #0969da; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
      .accent { fill: #0969da; }
      .cable { stroke: #59636e; stroke-width: 3; fill: none; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .card { fill: #161b22; stroke: #30363d; }
        .crypto { fill: #0c2a45; stroke: #4493f8; }
        .h, .card-h, .mono { fill: #e6edf3; }
        .lead, .sub, .note, .lbl { fill: #9198a1; }
        .flow, .cable { stroke: #9198a1; }
        .head { fill: #9198a1; }
        .edge { stroke: #4493f8; }
        .accent { fill: #4493f8; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="520" height="840"/>

  <text class="h" x="32" y="46">Где проходит граница</text>
  <text class="lead" x="32" y="74">Windows шифрует до отправки.</text>
  <text class="lead" x="32" y="96">Pi видит байты и иероглифы, а не файлы.</text>

  <rect class="card" x="32" y="116" width="456" height="88" rx="12"/>
  <text class="card-h" x="56" y="148">Проводник и программы</text>
  <text class="mono" x="56" y="178">диск X:</text>

  <line class="flow" x1="260" y1="206" x2="260" y2="240" marker-end="url(#arrow)"/>
  <text class="lbl" x="274" y="228">WinFsp</text>

  <rect class="crypto" x="32" y="242" width="456" height="132" rx="12"/>
  <text class="card-h" x="56" y="274">rclone mount + crypt</text>
  <text class="sub" x="56" y="296">ключ есть только здесь</text>
  <text class="mono" x="56" y="324">XSalsa20-Poly1305 (secretbox)</text>
  <text class="mono" x="56" y="350">шифруются и имена файлов</text>

  <line class="flow" x1="260" y1="376" x2="260" y2="410" marker-end="url(#arrow)"/>
  <text class="lbl" x="274" y="398">sftp</text>

  <rect class="card" x="32" y="412" width="456" height="88" rx="12"/>
  <text class="card-h" x="56" y="444">sftp-клиент</text>
  <text class="mono" x="56" y="474">OpenSSH, порт 22, ключ ed25519</text>

  <line class="edge" x1="32" y1="524" x2="488" y2="524"/>
  <text class="note" x="32" y="548">ниже линии — только шифротекст: Pi его не прочитает</text>
  <line class="cable" x1="430" y1="528" x2="430" y2="560" marker-end="url(#arrow)"/>
  <text class="lbl" x="446" y="548">гигабит</text>

  <rect class="card" x="32" y="560" width="456" height="150" rx="12"/>
  <text class="card-h" x="56" y="592">Raspberry Pi 5</text>
  <text class="mono" x="56" y="620">sshd + internal-sftp</text>
  <text class="mono" x="56" y="644">chroot /srv/cloud, без шелла</text>
  <text class="mono" x="56" y="668">ключ вне досягаемости</text>
  <text class="mono" x="56" y="692">без пробросов и терминала</text>

  <line class="flow" x1="260" y1="712" x2="260" y2="744" marker-end="url(#arrow)"/>

  <rect class="card" x="32" y="746" width="456" height="80" rx="12"/>
  <text class="card-h" x="56" y="778">NVMe 1 ТБ, ext4</text>
  <text class="mono" x="56" y="806">имена и содержимое нечитаемы</text>

  <text class="note" x="32" y="830"><tspan class="accent">Всё выше линии — клиент, и там открыто.</tspan></text>
</svg>
